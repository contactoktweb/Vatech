# Actualizaciones automáticas de dependencias.
# Dependabot revisa a diario si hay versiones nuevas; cada propuesta se compila en
# .github/workflows/dependencias.yml y, si todo pasa, se publica sola en main.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/Bogota"
    # Igual que pnpm-workspace.yaml: solo versiones publicadas hace al menos 1 día
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5
    labels: ["dependencias"]
    commit-message:
      prefix: "fix(deps)"
    groups:
      # Parches de seguridad y mejoras menores, todo en una sola propuesta
      seguridad-y-mejoras:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      alertas-de-seguridad:
        applies-to: security-updates
        update-types: ["minor", "patch"]
    ignore:
      # Los cambios de versión mayor pueden romper el sitio: se revisan a mano
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "ci"
